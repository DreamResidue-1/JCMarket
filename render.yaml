services:
  - name: jcmarket
    type: web
    runtime: static
    rootDir: JCMarket-ts
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        value: 489109189204-q3v366mm8ed5sht13bn7ra7vpqf1ujtn.apps.googleusercontent.com
      - key: VITE_API_URL
        value: "https://jcmarketbackend.onrender.com"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://jcmarketbackend.onrender.com/api/*
      - type: rewrite
        source: /images/*
        destination: https://jcmarketbackend.onrender.com/images/*
      - type: rewrite
        source: /*
        destination: /index.html

  - name: jcmarketbackend

    type: web
    runtime: node
    rootDir: ecommerce-backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: GOOGLE_CLIENT_ID
        value: 489109189204-q3v366mm8ed5sht13bn7ra7vpqf1ujtn.apps.googleusercontent.com
      - key: FRONTEND_URL
        value: https://jcmarket.onrender.com
